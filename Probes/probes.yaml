apiVersion: v1
kind: Pod
metadata:
  name: nginx-probes
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 15